name: Create Data

on:
  # TODO: Run this workflow every month
  # schedule:
  #   - cron: '0 0 * * *'
  workflow_dispatch:

# 既定は読み取りのみ。追加の権限が必要なジョブでだけ個別に宣言する
permissions:
  contents: read

jobs:
  create-data:
    runs-on: ubuntu-latest

    # id-token: write is required for AWS authentication
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Remove unused software
        run: |
          echo "Available storage before:"
          sudo df -h
          echo
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          echo "Available storage after:"
          sudo df -h
          echo

      - uses: actions/checkout@v7
        with:
          # どのジョブも git 認証を使わないため、認証情報をワークツリーに残さない
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Cache
        uses: actions/cache@v6
        with:
          key: 'v1'
          path: cache

      # NOTE: このジョブは id-token: write を持つため ACTIONS_ID_TOKEN_REQUEST_* が全ステップに
      # 露出しており、npm ci が走らせる better-sqlite3 などの install スクリプトから
      # AWS ロールを引き受けられる状態にある。生成物 out/api が巨大でジョブ間の受け渡しが
      # 現実的でないため分割していない。絞り込む場合は AWS ロールの信頼ポリシー側で行う。
      - name: Install dependencies
        run: npm ci

      - name: Create all data
        run: npm run run:all

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-northeast-1

      - name: Deploy to AWS
        run: |
          ./deploy/01_sync_to_s3.sh

      - name: Create archive
        run: |
          ./deploy/01a_create_archive.sh

      - name: Upload archive to S3
        run: |
          aws s3 cp \
            ./out/api.tar.zst s3://japanese-addresses-v2.geoloniamaps.com/experimental/api.tar.zst

  clear-cdn-cache:
    needs:
      - create-data

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # どのジョブも git 認証を使わないため、認証情報をワークツリーに残さない
          persist-credentials: false

      - name: Clear Cloudflare cache
        env:
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_PURGE_TOKEN }}
        run: |
          ./deploy/02_clear_cloudflare_cache.sh
