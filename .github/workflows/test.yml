name: Run Tests

on:
  pull_request:
    branches:
      - main
      - next
  push:
    branches:
      - main
      - next

# このワークフローは読み取りしか行わない
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # git 認証を使わないため、認証情報をワークツリーに残さない
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Cache
        uses: actions/cache@v6
        with:
          key: v1-${{ hashFiles('src/**') }}
          path: cache

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # npm run build は tsconfig.dist-*.json 経由で src/data.ts のみを対象にするため、
      # テストコードなどの型エラーを検出できない。tsconfig.json 全体を型検査する。
      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm run test
